name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build and test every product
        run: ./scripts/check.sh

  release:
    needs: ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release version and tag state
        id: release
        run: |
          version="$(sed -nE 's/^[[:space:]]*public static let version = "([^"]+)".*$/\1/p' Sources/EngageCore/EngageSDKInfo.swift | head -n 1)"
          ./scripts/validate-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $version already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag and GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.version }}" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.release.outputs.version }}"
